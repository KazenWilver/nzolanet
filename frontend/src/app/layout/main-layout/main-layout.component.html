<div class="main-layout" [class.main-layout--messages]="isFullWidthChatRoute">
  <div class="main-layout__sidebar">
    <app-sidebar />
  </div>

  <div
    class="main-layout__center"
    [class.main-layout__center--mobile-topbar]="showMobileTopbar"
  >
    <app-topbar />
    <main class="main-layout__content">
      <router-outlet />
    </main>
  </div>

  @if (!isFullWidthChatRoute) {
    <aside class="main-layout__aside">
      <app-aside />
    </aside>
  }
</div>

@if (mediaOverlay.state(); as overlay) {
  <app-publication-thread-modal
    [publication]="overlay.publication"
    [open]="true"
    [embedded]="false"
    [mediaFocus]="true"
    [videoStartTime]="overlay.videoStartTime"
    (closed)="handleCloseMediaOverlay()"
    (publicationChange)="handleMediaOverlayPublicationChange($event)"
  />
}

<app-modal
  [open]="publishModal.isOpen()"
  title="Criar publicação"
  (closed)="handleClosePublishModal()"
>
  @if (publishModal.isOpen()) {
    <app-create-post
      [modoModal]="true"
      (postCriado)="handlePostCreated()"
      (cancelado)="handleClosePublishModal()"
    />
  }
</app-modal>

@if (accountMenu.isOpen() && currentUser) {
  <div class="account-menu-layer" role="presentation">
    <button
      type="button"
      class="account-menu-layer__backdrop"
      aria-label="Fechar menu"
      (click)="handleCloseAccountMenu()"
    ></button>
    <nav
      #accountMenuNav
      class="account-menu"
      role="menu"
      aria-label="Menu da conta"
    >
      <a
        class="account-menu__item"
        routerLink="/settings"
        role="menuitem"
        (click)="handleAccountMenuNavigate()"
      >
        Definições
      </a>
      <a
        class="account-menu__item"
        [routerLink]="profileRoute"
        role="menuitem"
        (click)="handleAccountMenuNavigate()"
      >
        Perfil
      </a>
    </nav>
  </div>
}
