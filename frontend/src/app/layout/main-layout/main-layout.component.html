<div class="main-layout">
  <div class="main-layout__sidebar">
    <app-sidebar />
  </div>

  <div class="main-layout__center">
    <app-topbar />
    <main class="main-layout__content">
      <router-outlet />
    </main>
  </div>

  <aside class="main-layout__aside">
    <app-aside />
  </aside>
</div>

<app-modal
  [open]="publishModal.isOpen()"
  title="Criar publicação"
  (closed)="handleClosePublishModal()"
>
  @if (publishModal.isOpen()) {
    <app-create-post
      [modoModal]="true"
      (postCriado)="handlePostCreated()"
      (cancelado)="handleClosePublishModal()"
    />
  }
</app-modal>

@if (accountMenu.isOpen() && currentUser) {
  <div class="account-menu-layer" role="presentation" (click)="handleCloseAccountMenu()">
    <nav
      class="account-menu"
      role="menu"
      aria-label="Menu da conta"
      (click)="$event.stopPropagation()"
    >
      <a
        class="account-menu__item"
        routerLink="/settings"
        role="menuitem"
        (click)="handleAccountMenuNavigate()"
      >
        Definições
      </a>
      <a
        class="account-menu__item"
        [routerLink]="profileRoute"
        role="menuitem"
        (click)="handleAccountMenuNavigate()"
      >
        Perfil
      </a>
    </nav>
  </div>
}
