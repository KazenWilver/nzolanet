@if (visibleOnMobile) {
  <header class="topbar" [class.topbar--menu-open]="accountMenuOpen">
    <button
      type="button"
      class="topbar__theme-btn"
      (click)="handleToggleTheme()"
      [attr.aria-label]="themeService.isDarkMode() ? 'Activar modo claro' : 'Activar modo escuro'"
      [title]="themeService.isDarkMode() ? 'Modo claro' : 'Modo escuro'"
    >
      @if (themeService.isDarkMode()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      }
    </button>

    <a class="topbar__brand" routerLink="/feed" aria-label="NzolaNet">
      <img src="/nzolanet-logo.png" alt="NzolaNet" class="topbar__brand-icon" />
      <span class="topbar__brand-name">NzolaNet</span>
    </a>

    @if (currentUser) {
      <div class="topbar__account">
        <button
          type="button"
          class="topbar__account-trigger"
          (click)="handleToggleAccountMenu()"
          [attr.aria-expanded]="accountMenuOpen"
          aria-haspopup="menu"
          [attr.aria-label]="'Menu de ' + currentUser.username"
        >
          <app-avatar
            [src]="currentUser.profilePhotoUrl"
            [username]="currentUser.username"
            size="sm"
          />
        </button>
      </div>
    }
  </header>
}
