<aside class="sidebar" aria-label="Navegação principal">
  <div class="sidebar__desktop">
    <a class="sidebar__brand" routerLink="/feed" aria-label="NzolaNet">
      <img src="/nzolanet-logo.png" alt="" class="sidebar__brand-icon" />
      <span class="sidebar__brand-name">NzolaNet</span>
    </a>

    <nav class="sidebar__nav">
      @for (item of primaryNavItems; track item.id) {
        <a
          class="sidebar__link"
          [class.sidebar__link--active]="isActive(item.route, item.type === 'link' ? item.exact : false)"
          [routerLink]="item.route"
        >
          <span class="sidebar__icon" [attr.data-icon]="item.icon" aria-hidden="true"></span>
          <span class="sidebar__label">{{ item.label }}</span>
        </a>
      }

      <a
        class="sidebar__link"
        [class.sidebar__link--active]="isActive(profileRoute)"
        [routerLink]="profileRoute"
      >
        <span class="sidebar__icon" data-icon="user" aria-hidden="true"></span>
        <span class="sidebar__label">Perfil</span>
      </a>

      @for (item of secondaryNavItems; track item.id) {
        <a
          class="sidebar__link"
          [class.sidebar__link--active]="isActive(item.route)"
          [routerLink]="item.route"
        >
          <span class="sidebar__icon" [attr.data-icon]="item.icon" aria-hidden="true"></span>
          <span class="sidebar__label">{{ item.label }}</span>
        </a>
      }

      <button
        type="button"
        class="sidebar__link sidebar__link--theme"
        (click)="handleToggleTheme()"
        [attr.aria-label]="themeService.isDarkMode() ? 'Activar modo claro' : 'Activar modo escuro'"
      >
        <span class="sidebar__icon" [attr.data-icon]="themeService.isDarkMode() ? 'sun' : 'moon'" aria-hidden="true"></span>
        <span class="sidebar__label">{{ themeService.isDarkMode() ? 'Modo claro' : 'Modo escuro' }}</span>
      </button>
    </nav>

    <button type="button" class="sidebar__publish" (click)="handleOpenPublishModal()">
      <span class="sidebar__publish-icon" aria-hidden="true">+</span>
      <span class="sidebar__publish-label">Publicar</span>
    </button>

    @if (currentUser) {
      <a class="sidebar__account" [routerLink]="profileRoute">
        <app-avatar
          [src]="currentUser.profilePhotoUrl"
          [username]="currentUser.username"
          size="sm"
        />
        <span class="sidebar__account-text">
          <strong>{{ displayName }}</strong>
          <small>@{{ currentUser.username }}</small>
        </span>
      </a>
      <button type="button" class="sidebar__logout" (click)="handleLogout()">
        <span class="sidebar__icon" data-icon="logout" aria-hidden="true"></span>
        <span class="sidebar__label">Terminar sessão</span>
      </button>
    }
  </div>

  <nav class="sidebar__mobile" aria-label="Navegação mobile">
    <a class="sidebar__mobile-link" routerLink="/feed" [class.sidebar__mobile-link--active]="isActive('/feed', true)">
      <span class="sidebar__icon" data-icon="home" aria-hidden="true"></span>
    </a>
    <a class="sidebar__mobile-link" routerLink="/search" [class.sidebar__mobile-link--active]="isActive('/search')">
      <span class="sidebar__icon" data-icon="search" aria-hidden="true"></span>
    </a>
    <button type="button" class="sidebar__mobile-publish" (click)="handleOpenPublishModal()" aria-label="Publicar">
      <span class="sidebar__publish-icon" aria-hidden="true">+</span>
    </button>
    <a class="sidebar__mobile-link" routerLink="/settings" [class.sidebar__mobile-link--active]="isActive('/settings')">
      <span class="sidebar__icon" data-icon="settings" aria-hidden="true"></span>
      <span class="sr-only">Definições</span>
    </a>
    <a class="sidebar__mobile-link" [routerLink]="profileRoute" [class.sidebar__mobile-link--active]="isActive(profileRoute)">
      @if (currentUser) {
        <app-avatar [src]="currentUser.profilePhotoUrl" [username]="currentUser.username" size="xs" />
      } @else {
        <span class="sidebar__icon" data-icon="user" aria-hidden="true"></span>
      }
    </a>
  </nav>
</aside>
