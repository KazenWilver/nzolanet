<aside class="aside" aria-label="Explorar">
  <form class="aside__search" (ngSubmit)="$event.preventDefault(); handleSearchInput()">
    <span class="aside__search-icon" aria-hidden="true"></span>
    <input
      id="aside-search-input"
      class="aside__search-input"
      type="search"
      name="asideSearch"
      [(ngModel)]="searchQuery"
      (input)="handleSearchKeyup()"
      placeholder="Pesquisar utilizadores..."
      aria-label="Pesquisa rápida de utilizadores"
    />
  </form>

  <section class="aside__section">
    <header class="aside__section-header">Tendências</header>
    @if (trendingHashtags.length === 0) {
      <p class="aside__empty">Sem tendências de momento.</p>
    } @else {
      <ul class="aside__trends">
        @for (tag of trendingHashtags; track tag) {
          <li>
            <a [routerLink]="['/search']" [queryParams]="{ q: '#' + tag }">#{{ tag }}</a>
          </li>
        }
      </ul>
    }
  </section>

  <section class="aside__section">
    <app-who-to-follow [count]="3" />
  </section>
</aside>
