<aside class="aside" aria-label="Explorar">
  <form class="aside__search" (ngSubmit)="$event.preventDefault(); handleSearchInput()">
    <span class="aside__search-icon" aria-hidden="true"></span>
    <input
      id="aside-search-input"
      class="aside__search-input"
      type="search"
      name="asideSearch"
      [(ngModel)]="searchQuery"
      (input)="handleSearchKeyup()"
      [placeholder]="'nav.search' | t"
      aria-label="Pesquisa rápida de utilizadores"
    />
  </form>

  <section class="aside__section">
    <header class="aside__section-header">Tendências</header>
    @if (trendsError) {
      <p class="aside__empty">Não foi possível carregar tendências.</p>
    } @else if (trendingHashtags.length === 0) {
      <p class="aside__empty">Sem tendências por agora.</p>
    } @else {
      <ol class="aside__trends">
        @for (item of trendingHashtags; track item.tag; let i = $index) {
          <li class="aside__trend-item">
            <a [routerLink]="['/search']" [queryParams]="{ q: '#' + item.tag }" class="aside__trend-link">
              <span class="aside__trend-rank">{{ i + 1 }}.</span>
              <span class="aside__trend-body">
                <span class="aside__trend-tag">#{{ item.tag }}</span>
                <span class="aside__trend-count">{{ item.count }} publicações</span>
              </span>
            </a>
          </li>
        }
      </ol>
    }
  </section>

  <section class="aside__section">
    <app-who-to-follow [count]="3" />
  </section>
</aside>
