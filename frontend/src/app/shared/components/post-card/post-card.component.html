<article class="post-card">
  <header class="post-card__cabecalho">
    <app-user-avatar [foto]="post.autorFoto" [nome]="post.autorNome" tamanho="md" />

    <div class="post-card__meta">
      <div class="post-card__linha-autor">
        <a class="post-card__nome" [routerLink]="['/perfil', post.autorId]">{{ post.autorNome }}</a>
        <span class="post-card__handle">@{{ post.autorNomeUtilizador }}</span>
        <span class="post-card__tempo">· {{ post.criadoEm | tempoAtras }}</span>
        <span *ngIf="post.atualizadoEm" class="post-card__editado">Editado</span>
      </div>
    </div>

    <div class="post-card__opcoes" *ngIf="eMinhaPub()">
      <button class="post-card__btn-opcoes" (click)="alternarOpcoes()" title="Opções">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5"></circle>
          <circle cx="12" cy="12" r="1.5"></circle>
          <circle cx="12" cy="19" r="1.5"></circle>
        </svg>
      </button>
      <div class="post-card__menu" *ngIf="opcoesAbertas">
        <a class="post-card__menu-item" *ngIf="podeEditarPublicacao()" [routerLink]="['/publicacoes', post.id, 'editar']">Editar</a>
        <button class="post-card__menu-item post-card__menu-item--perigo" (click)="confirmarEliminacao()">Eliminar</button>
      </div>
    </div>
  </header>

  <div class="post-card__corpo">
    <p class="post-card__texto">{{ post.texto }}</p>
    <app-media-preview *ngIf="post.imagemUrl || post.videoUrl"
      [imagemUrl]="post.imagemUrl"
      [videoUrl]="post.videoUrl" />
  </div>

  <footer class="post-card__rodape">
    <button class="post-card__acao post-card__acao--comentario" [routerLink]="['/publicacoes', post.id]">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
      </svg>
      <span>{{ post.totalComentarios }}</span>
    </button>

    <button class="post-card__acao" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="m17 2 4 4-4 4"></path>
        <path d="M3 11V9a3 3 0 0 1 3-3h15"></path>
        <path d="m7 22-4-4 4-4"></path>
        <path d="M21 13v2a3 3 0 0 1-3 3H3"></path>
      </svg>
      <span>{{ post.totalComentarios + 3 }}</span>
    </button>

    <button class="post-card__acao post-card__acao--baze" [class.post-card__acao--ativo]="post.utilizadorDeuBaze" (click)="alternarBaze()" [disabled]="eMinhaPub()" [title]="eMinhaPub() ? 'Não podes dar Baze na tua própria publicação' : ''">
      <svg width="17" height="17" viewBox="0 0 24 24"
        [attr.fill]="post.utilizadorDeuBaze ? 'currentColor' : 'none'"
        stroke="currentColor" stroke-width="1.8">
        <path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 0 1 12 6a5 5 0 0 1 7.5 6.6Z"></path>
      </svg>
      <span>{{ post.totalBazes }}</span>
    </button>

    <button class="post-card__acao" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 12v8h16v-8"></path>
        <path d="M16 6 12 2 8 6"></path>
        <path d="M12 2v13"></path>
      </svg>
    </button>
  </footer>
</article>

<app-confirm-dialog
  *ngIf="dialogoEliminacao"
  mensagem="Tens a certeza que queres eliminar esta publicação?"
  (confirmado)="eliminar()"
  (cancelado)="dialogoEliminacao = false" />
