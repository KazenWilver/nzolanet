<article class="post-card">
  <header class="post-card__cabecalho">
    <app-user-avatar [foto]="post.autorFoto" [nome]="post.autorNome" tamanho="md" />
    <div class="post-card__meta">
      <a class="post-card__nome" [routerLink]="['/perfil', post.autorId]">{{ post.autorNome }}</a>
      <span class="post-card__tempo">{{ post.criadoEm | tempoAtras }}</span>
      <span *ngIf="post.atualizadoEm" class="post-card__editado">Editado</span>
    </div>
    <div class="post-card__opcoes" *ngIf="eMinhaPub()">
      <button class="post-card__btn-opcoes" (click)="alternarOpcoes()" title="Opções">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
        </svg>
      </button>
      <div class="post-card__menu" *ngIf="opcoesAbertas">
        <a class="post-card__menu-item" *ngIf="podeEditarPublicacao()" [routerLink]="['/publicacoes', post.id, 'editar']">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Editar
        </a>
        <button class="post-card__menu-item post-card__menu-item--perigo" (click)="confirmarEliminacao()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
          </svg>
          Eliminar
        </button>
      </div>
    </div>
  </header>

  <div class="post-card__corpo">
    <p class="post-card__texto">{{ post.texto }}</p>
    <app-media-preview *ngIf="post.imagemUrl || post.videoUrl"
      [imagemUrl]="post.imagemUrl"
      [videoUrl]="post.videoUrl" />
  </div>

  <footer class="post-card__rodape">
    <button class="post-card__acao" [class.post-card__acao--ativo]="post.utilizadorDeuBaze" (click)="alternarBaze()">
      <svg width="16" height="16" viewBox="0 0 24 24"
        [attr.fill]="post.utilizadorDeuBaze ? 'currentColor' : 'none'"
        stroke="currentColor" stroke-width="2">
        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
        <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
      </svg>
      <span>{{ post.totalBazes }}</span>
    </button>

    <button class="post-card__acao" [routerLink]="['/publicacoes', post.id]">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>{{ post.totalComentarios }}</span>
    </button>
  </footer>
</article>

<app-confirm-dialog
  *ngIf="dialogoEliminacao"
  mensagem="Tens a certeza que queres eliminar esta publicação?"
  (confirmado)="eliminar()"
  (cancelado)="dialogoEliminacao = false" />
