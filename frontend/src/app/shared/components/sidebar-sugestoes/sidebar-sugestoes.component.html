<aside class="sidebar-sugestoes">
  <form class="sidebar-sugestoes__search" (ngSubmit)="handleSearchSubmit()">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input
      id="sidebar-suggestions-search"
      type="search"
      placeholder="Pesquisar utilizadores..."
      name="searchQuery"
      [(ngModel)]="searchQuery"
      aria-label="Pesquisar utilizadores"
    />
  </form>

  <section class="sidebar-sugestoes__widget">
    <app-placeholder-feature featureName="Tendências" />
  </section>

  <section class="sidebar-sugestoes__widget">
    <app-placeholder-feature featureName="Quem seguir" />
  </section>
</aside>
