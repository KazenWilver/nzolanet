<aside class="sidebar-sugestoes">
  <section class="widget">
    <h3 class="widget__titulo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 17 6-6 4 4 8-8"></path>
        <path d="M14 7h7v7"></path>
      </svg>
      Tendências
    </h3>

    <button *ngFor="let trend of tendencias; let i = index" type="button" class="tendencia-item" (click)="pesquisarHashtag(trend.hashtag)">
      <span class="tendencia-item__rank">{{ i + 1 }}</span>
      <span class="tendencia-item__body">
        <strong>{{ trend.hashtag }}</strong>
        <small>{{ trend.posts }} posts</small>
      </span>
    </button>

    <button class="widget__more" type="button">Ver mais</button>
  </section>

  <section class="widget">
    <h3 class="widget__titulo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      Quem seguir
    </h3>

    <div class="widget__sugestoes">
      <div *ngFor="let user of sugestoesAoSeguir" class="sugestao-item">
        <div class="sugestao-item__avatar">
          <span>{{ getInitials(user.nome) }}</span>
        </div>
        <div class="sugestao-item__info">
          <strong>{{ user.nome }}</strong>
          <small>@{{ user.nomeUtilizador }}</small>
        </div>
        <button class="sugestao-item__btn" type="button" (click)="seguir(user.id)">
          {{ user.seguido ? 'A seguir' : 'Seguir' }}
        </button>
      </div>
    </div>

    <button class="widget__more" type="button">Ver mais</button>
  </section>

  <section class="widget widget--footer">
    <p>
      Sobre · Ajuda · Termos · Privacidade · Estado · Carreiras
    </p>
    <p>© 2026 NzolaNet</p>
  </section>
</aside>
