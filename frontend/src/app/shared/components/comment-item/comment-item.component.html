<div class="comentario-item">
  <app-user-avatar [foto]="comentario.autorFoto" [nome]="comentario.autorNome" tamanho="sm" />
  <div class="comentario-item__conteudo">
    <div class="comentario-item__balao">
      <a class="comentario-item__autor" [routerLink]="['/perfil', comentario.autorId]">{{ comentario.autorNome }}</a>
      <span *ngIf="comentario.atualizadoEm" class="comentario-item__editado">Editado</span>
      <p *ngIf="!aEditar" class="comentario-item__texto">{{ comentario.texto }}</p>
      <div *ngIf="aEditar" class="comentario-item__edicao">
        <textarea class="comentario-item__textarea" [(ngModel)]="textoEditado" rows="2"></textarea>
        <div class="comentario-item__edicao-acoes">
          <button class="comentario-item__btn comentario-item__btn--guardar" (click)="guardar()">Guardar</button>
          <button class="comentario-item__btn comentario-item__btn--cancelar" (click)="cancelarEdicao()">Cancelar</button>
        </div>
      </div>
    </div>
    <div class="comentario-item__rodape">
      <span class="comentario-item__tempo">{{ comentario.criadoEm | tempoAtras }}</span>
      <div class="comentario-item__acoes">
        <button class="comentario-item__btn-link" (click)="iniciarEdicao()" *ngIf="podeEditar()">Editar</button>
        <button class="comentario-item__btn-link comentario-item__btn-link--warning" (click)="denunciar()" *ngIf="!eMeuComentario() && !authService.obterUtilizadorAtual()?.eAdmin && !comentario.reportadoPorMim">Denunciar</button>
        <span class="comentario-item__label comentario-item__label--denunciado" *ngIf="comentario.reportadoPorMim">Denúncia enviada</span>
        <button class="comentario-item__btn-link comentario-item__btn-link--perigo" (click)="confirmarEliminacao()" *ngIf="podeEliminar()">Eliminar</button>
      </div>
    </div>
    <div class="comentario-item__denuncias" *ngIf="authService.obterUtilizadorAtual()?.eAdmin && comentario.reportsCount && comentario.reportsCount > 0">
      <span>{{ comentario.reportsCount }} denúncia{{ comentario.reportsCount === 1 ? '' : 's' }}</span>
    </div>
  </div>
</div>

<app-confirm-dialog
  *ngIf="dialogoEliminacao"
  mensagem="Eliminar este comentário?"
  (confirmado)="eliminar()"
  (cancelado)="dialogoEliminacao = false" />

<app-report-dialog
  *ngIf="dialogoDenuncia"
  tipo="comentario"
  [disabled]="denunciando"
  (confirmado)="enviarDenuncia($event)"
  (cancelado)="cancelarDenuncia()" />
