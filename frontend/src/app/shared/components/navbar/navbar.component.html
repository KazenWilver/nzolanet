<nav class="navbar">
  <div class="navbar__marca" routerLink="/feed">NzolaNet</div>

  <div class="navbar__pesquisa">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Pesquisar..." [(ngModel)]="termoPesquisa" (keyup.enter)="pesquisar()" />
  </div>

  <div class="navbar__acoes">
    <button class="navbar__btn" routerLink="/feed" routerLinkActive="navbar__btn--ativo"
      [routerLinkActiveOptions]="{exact:true}" title="Feed">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>

    <button class="navbar__btn navbar__btn--notificacao" type="button" title="Notificações"
      [class.navbar__btn--ativo]="notificacoesAberto" (click)="alternarNotificacoes()"
      aria-haspopup="true" [attr.aria-expanded]="notificacoesAberto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="navbar__badge" *ngIf="totalNotificacoes > 0">{{ totalNotificacoes }}</span>
    </button>

    <div class="navbar__notificacoes" *ngIf="notificacoesAberto">
      <header class="navbar__notificacoes-header">
        <strong>Notificações</strong>
        <button type="button" class="navbar__notificacoes-lidas" (click)="marcarTodasComoLidas()">Marcar como lidas</button>
      </header>
      <div class="navbar__notificacoes-list">
        <div *ngIf="notificacoesPreview.length === 0" class="navbar__notificacoes-empty">
          Não há notificações.
        </div>
        <a *ngFor="let notificacao of notificacoesPreview" class="navbar__notificacoes-item" [routerLink]="['/notificacoes']" (click)="notificacoesAberto = false">
          <span class="navbar__notificacoes-indicator" *ngIf="!notificacao.lida"></span>
          <div>
            <div class="navbar__notificacoes-title">
              <strong>{{ notificacao.utilizadorNome }}</strong>
              <span>{{ notificacao.tipo | titlecase }}</span>
            </div>
            <p *ngIf="notificacao.postId">Publicação #{{ notificacao.postId }}</p>
          </div>
        </a>
      </div>
      <a class="navbar__notificacoes-ver-todas" [routerLink]="['/notificacoes']" (click)="notificacoesAberto = false">Ver todas as notificações</a>
    </div>

    <div class="navbar__avatar-wrap" (click)="alternarMenuUtilizador()">
      <app-user-avatar [foto]="utilizadorAtual?.fotoPerfil" [nome]="utilizadorAtual?.nome" tamanho="sm" />
      <div class="navbar__menu-utilizador" *ngIf="menuAberto">
        <a [routerLink]="['/perfil', utilizadorAtual?.id]" class="navbar__menu-item" (click)="fecharMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Meu Perfil
        </a>
        <a [routerLink]="['/perfil', utilizadorAtual?.id, 'editar']" class="navbar__menu-item" (click)="fecharMenu()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Editar Perfil
        </a>
        <!-- Admin link removed to avoid exposing admin panel to regular users -->
        <div class="navbar__menu-divider"></div>
        <button class="navbar__menu-item navbar__menu-item--sair" (click)="terminarSessao()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Terminar Sessão
        </button>
      </div>
    </div>
  </div>
</nav>
