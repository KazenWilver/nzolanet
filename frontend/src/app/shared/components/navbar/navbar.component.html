<nav class="navbar">
  <h1 class="navbar__title">{{ tituloPagina }}</h1>
  <div class="navbar__spacer"></div>

  <div class="navbar__pesquisa">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input type="text" placeholder="Pesquisar" [(ngModel)]="termoPesquisa" (keyup.enter)="pesquisar()" />
    <kbd>⌘ K</kbd>
  </div>

  <div class="navbar__acoes">
    <button class="navbar__btn" type="button" (click)="alternarTema()" [title]="modoEscuro ? 'Modo claro' : 'Modo escuro'">
      <svg *ngIf="modoEscuro" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
      <svg *ngIf="!modoEscuro" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
    </button>

    <button class="navbar__btn navbar__btn--notificacao" type="button" title="Notificações"
      [class.navbar__btn--ativo]="notificacoesAberto" (click)="alternarNotificacoes()"
      aria-haspopup="true" [attr.aria-expanded]="notificacoesAberto">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="navbar__badge" *ngIf="totalNotificacoes > 0">{{ totalNotificacoes }}</span>
    </button>

    <div class="navbar__notificacoes" *ngIf="notificacoesAberto">
      <header class="navbar__notificacoes-header">
        <strong>Notificações</strong>
        <button type="button" class="navbar__notificacoes-lidas" (click)="marcarTodasComoLidas()">Marcar como lidas</button>
      </header>
      <div class="navbar__notificacoes-list">
        <div *ngIf="notificacoesPreview.length === 0" class="navbar__notificacoes-empty">
          Não há notificações.
        </div>
        <a *ngFor="let notificacao of notificacoesPreview" class="navbar__notificacoes-item" [routerLink]="['/notificacoes']" (click)="notificacoesAberto = false">
          <span class="navbar__notificacoes-indicator" *ngIf="!notificacao.lida"></span>
          <div>
            <div class="navbar__notificacoes-title">
              <strong>{{ notificacao.utilizadorNome }}</strong>
              <span>{{ notificacao.tipo | titlecase }}</span>
            </div>
            <p *ngIf="notificacao.postId">Publicação #{{ notificacao.postId }}</p>
          </div>
        </a>
      </div>
      <a class="navbar__notificacoes-ver-todas" [routerLink]="['/notificacoes']" (click)="notificacoesAberto = false">Ver todas</a>
    </div>

    <div class="navbar__avatar-wrap" (click)="alternarMenuUtilizador()">
      <app-user-avatar [foto]="utilizadorAtual?.fotoPerfil" [nome]="utilizadorAtual?.nome" tamanho="sm" />
      <div class="navbar__menu-utilizador" *ngIf="menuAberto">
        <a [routerLink]="['/perfil', utilizadorAtual?.id]" class="navbar__menu-item" (click)="fecharMenu()">Meu perfil</a>
        <a [routerLink]="['/perfil', utilizadorAtual?.id, 'editar']" class="navbar__menu-item" (click)="fecharMenu()">Editar perfil</a>
        <div class="navbar__menu-divider"></div>
        <button class="navbar__menu-item navbar__menu-item--sair" (click)="terminarSessao()">Terminar sessão</button>
      </div>
    </div>
  </div>
</nav>
