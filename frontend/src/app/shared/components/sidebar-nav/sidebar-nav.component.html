<nav class="sidebar-nav">
  <div class="sidebar-nav__top">
    <a class="sidebar-nav__brand" routerLink="/feed" aria-label="NzolaNet">
      <img src="/nzolanet-logo.png" alt="" class="sidebar-nav__brand-mark" />
      <span class="sidebar-nav__brand-name">NzolaNet</span>
    </a>
    <button class="sidebar-nav__collapse" type="button" aria-label="Recolher menu">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m11 19-7-7 7-7"></path>
        <path d="m20 19-7-7 7-7"></path>
      </svg>
    </button>
  </div>

  <ul class="sidebar-nav__list">
    <li *ngFor="let item of menuItems">
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="sidebar-nav__link"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" [innerHTML]="getIconSvg(item.icon)"></svg>
        <span class="sidebar-nav__label-item">{{ item.label }}</span>
        <span class="sidebar-nav__badge" *ngIf="item.badge">{{ item.badge }}</span>
      </a>
    </li>
  </ul>

  <a class="sidebar-nav__new-post" routerLink="/feed">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 5v14"></path>
      <path d="M5 12h14"></path>
    </svg>
    <span>Nova publicação</span>
  </a>

  <a class="sidebar-nav__account" routerLink="/perfil/me">
    <app-user-avatar [foto]="utilizadorAtual?.fotoPerfil" [nome]="utilizadorAtual?.nome" tamanho="sm" />
    <span class="sidebar-nav__account-text">
      <strong>{{ utilizadorAtual?.nome || 'Utilizador' }}</strong>
      <small>@{{ utilizadorAtual?.nomeUtilizador || 'nzolanet' }}</small>
    </span>
    <span class="sidebar-nav__dots">•••</span>
  </a>
</nav>
