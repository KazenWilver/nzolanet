<nav class="sidebar-nav">
  <div class="sidebar-nav__section">
    <h2 class="sidebar-nav__label">Menu</h2>
    <ul class="sidebar-nav__list">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" 
           routerLinkActive="active" 
           [routerLinkActiveOptions]="{ exact: true }"
           class="sidebar-nav__link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [innerHTML]="getIconSvg(item.icon)"></svg>
          <span class="sidebar-nav__label-item">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-nav__section sidebar-nav__section--online">
    <h3 class="sidebar-nav__label">Amigos Online</h3>
    <div class="sidebar-nav__amigos">
      <div *ngFor="let amigo of amigosOnline" class="sidebar-nav__amigo-item">
        <div class="sidebar-nav__amigo-avatar-wrap">
          <app-user-avatar [foto]="amigo.fotoPerfil" [nome]="amigo.nome" tamanho="sm" />
          <span class="sidebar-nav__online-dot"></span>
        </div>
        <span class="sidebar-nav__amigo-nome" [title]="amigo.nome">{{ amigo.nome }}</span>
      </div>
    </div>
  </div>
</nav>
