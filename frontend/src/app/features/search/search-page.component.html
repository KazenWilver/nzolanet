<section class="search-page">
  <header class="search-page__topo">
    <div>
      <h1>Explorar</h1>
      <p *ngIf="termo; else semTermo">Resultados para "{{ termo }}"</p>
      <ng-template #semTermo>
        <p>Pesquisa utilizadores, publicações e tendências da comunidade.</p>
      </ng-template>
    </div>

    <form class="search-page__form" (ngSubmit)="pesquisar()" novalidate>
      <input
        class="search-page__input"
        type="search"
        placeholder="Buscar no NzolaNet"
        [(ngModel)]="termo"
        name="searchTerm"
        autocomplete="off"
      />
      <button class="search-page__button" type="submit">Pesquisar</button>
    </form>
  </header>

  <div class="search-page__conteudo">
    <div *ngIf="aCarregar" class="search-page__loading">
      <app-loading-spinner />
    </div>

    <section *ngIf="!aCarregar && utilizadores.length > 0" class="search-page__section">
      <h2 class="search-page__section-titulo">Utilizadores</h2>
      <div class="search-page__users">
        <a *ngFor="let u of utilizadores" class="search-page__user-card" [routerLink]="['/perfil', u.id]">
          <app-user-avatar [foto]="u.fotoPerfil" [nome]="u.nome" tamanho="md" />
          <span class="search-page__user-info">
            <strong>{{ u.nome }}</strong>
            <small>@{{ u.nomeUtilizador }}</small>
          </span>
          <span class="search-page__user-btn">Ver perfil</span>
        </a>
      </div>
    </section>

    <section *ngIf="!aCarregar && posts.length > 0" class="search-page__section">
      <h2 class="search-page__section-titulo">Publicações</h2>
      <app-post-card *ngFor="let post of posts; trackBy: trackPorId" [post]="post" />
    </section>

    <div *ngIf="!aCarregar && termo && posts.length === 0 && utilizadores.length === 0" class="search-page__empty">
      <p>Nenhum resultado encontrado para "{{ termo }}".</p>
    </div>
  </div>
</section>
