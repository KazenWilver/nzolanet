<div class="criar-post">
  <div class="criar-post__cabecalho" *ngIf="!formularioAberto">
    <app-user-avatar [foto]="utilizadorAtual?.fotoPerfil" [nome]="utilizadorAtual?.nome" tamanho="md" />
    <button class="criar-post__gatilho" (click)="abrirFormulario()">
      O que estás a pensar, {{ (utilizadorAtual?.nome || '').split(' ')[0] }}?
    </button>
  </div>

  <form *ngIf="formularioAberto" class="criar-post__formulario" (ngSubmit)="publicar()">
    <div class="criar-post__composer">
      <app-user-avatar [foto]="utilizadorAtual?.fotoPerfil" [nome]="utilizadorAtual?.nome" tamanho="md" />
      <textarea
        class="criar-post__textarea"
        placeholder="O que estás a pensar?"
        [(ngModel)]="texto"
        name="texto"
        rows="2"
        (input)="ajustarAltura($event)">
      </textarea>
    </div>

    <div class="criar-post__erro" *ngIf="erro">
      {{ erro }}
    </div>

    <div class="criar-post__previsao" *ngIf="previsaoUrl">
      <button type="button" class="criar-post__remover" (click)="removerMedia()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img *ngIf="tipoMedia === 'imagem'" [src]="previsaoUrl" alt="Pré-visualização" class="criar-post__img-previsao" />
      <video *ngIf="tipoMedia === 'video'" [src]="previsaoUrl" class="criar-post__video-previsao" controls></video>
    </div>

    <div class="criar-post__rodape">
      <div class="criar-post__acoes-media">
        <label class="criar-post__btn-media">
          <input type="file" accept="image/*,video/*" (change)="selecionarAnexo($event)" hidden />
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="m21 15-5-5L5 21"></path>
          </svg>
          Ficheiro
        </label>

        <button type="button" class="criar-post__btn-media">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-6"></path>
          </svg>
          Poll
        </button>
      </div>

      <div class="criar-post__acoes-principais">
        <button type="button" class="criar-post__btn-cancelar" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="criar-post__btn-publicar" [disabled]="!texto.trim() || aPublicar">
          <app-loading-spinner *ngIf="aPublicar" tamanho="sm" />
          <span *ngIf="!aPublicar">Publicar</span>
        </button>
      </div>
    </div>
  </form>
</div>
