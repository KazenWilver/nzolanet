<div class="create-publication" [class.create-publication--modal]="modoModal">
  @if (!formOpen && !modoModal) {
    <div class="create-publication__trigger-row">
      <app-avatar
        [src]="currentUser?.profilePhotoUrl"
        [username]="currentUser?.username ?? 'user'"
        size="md"
      />
      <button type="button" class="create-publication__trigger" (click)="openForm()">
        O que está a acontecer?
      </button>
    </div>
  }

  @if (formOpen) {
    <form class="create-publication__form" (ngSubmit)="publish()">
      <div class="create-publication__composer">
        <app-avatar
          [src]="currentUser?.profilePhotoUrl"
          [username]="currentUser?.username ?? 'user'"
          size="md"
        />
        <textarea
          id="publication-text"
          class="create-publication__textarea"
          placeholder="O que está a acontecer?"
          [(ngModel)]="text"
          name="text"
          rows="2"
          [maxlength]="maxChars"
          (input)="adjustHeight($event)"
        ></textarea>
      </div>

      @if (error) {
        <p class="create-publication__error" role="alert">{{ error }}</p>
      }

      @if (previewUrl) {
        <div class="create-publication__preview">
          <button
            type="button"
            class="create-publication__remove-media"
            (click)="removeMedia()"
            aria-label="Remover ficheiro"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          @if (mediaType === 'image') {
            <img [src]="previewUrl" alt="Pré-visualização" class="create-publication__preview-image" />
          }
          @if (mediaType === 'video') {
            <video [src]="previewUrl" class="create-publication__preview-video" controls></video>
          }
        </div>
      }

      <div class="create-publication__footer">
        <div class="create-publication__toolbar">
          <label class="create-publication__media-btn" aria-label="Adicionar imagem">
            <input
              id="publication-image-file"
              name="publicationImage"
              type="file"
              accept="image/*"
              (change)="selectFile($event, 'image')"
              hidden
            />
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="m21 15-5-5L5 21"></path>
            </svg>
          </label>

          <label class="create-publication__media-btn" aria-label="Adicionar vídeo">
            <input
              id="publication-video-file"
              name="publicationVideo"
              type="file"
              accept="video/*"
              (change)="selectFile($event, 'video')"
              hidden
            />
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2"></rect>
            </svg>
          </label>

          <span
            class="create-publication__counter"
            [class.create-publication__counter--warn]="remainingChars <= 20"
          >
            {{ remainingChars }}
          </span>
        </div>

        <div class="create-publication__actions">
          <button type="button" class="create-publication__btn-cancel" (click)="cancel()">
            Cancelar
          </button>
          <button type="submit" class="create-publication__btn-publish" [disabled]="!canPublish">
            @if (publishing) {
              <app-loading-spinner tamanho="sm" />
            } @else {
              Publicar
            }
          </button>
        </div>
      </div>
    </form>
  }
</div>
