<div class="feed-page">
  <nav class="feed-page__tabs" aria-label="Tipo de feed">
    <button
      type="button"
      class="feed-page__tab"
      [class.feed-page__tab--active]="activeTab === 'para-ti'"
      [attr.aria-selected]="activeTab === 'para-ti'"
      role="tab"
      (click)="setTab('para-ti')"
    >
      Para ti
    </button>
    <button
      type="button"
      class="feed-page__tab"
      [class.feed-page__tab--active]="activeTab === 'a-seguir'"
      [attr.aria-selected]="activeTab === 'a-seguir'"
      role="tab"
      (click)="setTab('a-seguir')"
    >
      A seguir
    </button>
  </nav>

  <app-create-post (postCriado)="handleCreated($event)" />

  @if (loading) {
    <div class="feed-page__loading">
      <app-loading-spinner tamanho="md" />
    </div>
  }

  @if (error) {
    <div class="feed-page__error">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <p>Não foi possível carregar o feed. Tenta novamente.</p>
      <button type="button" class="feed-page__retry" (click)="loadFeed()">Tentar novamente</button>
    </div>
  }

  @if (!loading && !error && publications.length === 0) {
    <div class="feed-page__empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <p>{{ emptyMessage }}</p>
    </div>
  }

  @for (publication of publications; track trackById($index, publication)) {
    <div [id]="'publication-' + publication.id">
      <app-publication-card
        [publication]="publication"
        [currentUserId]="currentUserId"
        [highlighted]="publication.id === focusPublicationId"
        [expandComments]="publication.id === expandCommentsForPublicationId"
        (deleted)="handleDeleted($event)"
        (updated)="handleUpdated($event)"
      />
    </div>
  }
</div>
