<section class="groups-page">
  <header class="groups-page__header">
    <div>
      <h1>Grupos</h1>
      <p>Explora comunidades e junta-te a grupos que combinam com os teus interesses.</p>
    </div>
  </header>

  <div class="groups-page__list">
    <article *ngFor="let grupo of grupos" class="groups-page__card">
      <div>
        <h2>{{ grupo.nome }}</h2>
        <p>{{ grupo.descricao }}</p>
        <span>{{ grupo.membros }} membros</span>
      </div>
      <button type="button" (click)="alternarSeguir(grupo)">
        {{ grupo.seguido ? 'Seguindo' : 'Seguir' }}
      </button>
    </article>
  </div>
</section>
