<div class="editar-post" *ngIf="post; else aCarregar">
  <div class="editar-post__cabecalho">
    <button class="editar-post__btn-voltar" (click)="voltar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Cancelar
    </button>
    <h1 class="editar-post__titulo">Editar publicação</h1>
  </div>

  <div class="editar-post__formulario">
    <div class="editar-post__autor">
      <app-user-avatar [foto]="post.autorFoto" [nome]="post.autorNome" tamanho="md" />
      <span class="editar-post__nome">{{ post.autorNome }}</span>
    </div>
    <div *ngIf="limiteEdicaoExpirado" class="editar-post__alerta">
      O prazo de edição desta publicação expirou. Só é possível editar dentro de 7 dias após a publicação.
    </div>
    <textarea class="editar-post__textarea" [(ngModel)]="textoEditado" rows="5" placeholder="Edita a tua publicação..."></textarea>
    <div class="editar-post__acoes">
      <button class="editar-post__btn-cancelar" (click)="voltar()">Cancelar</button>
      <button class="editar-post__btn-guardar" (click)="guardar()" [disabled]="!textoEditado.trim() || aGuardar || limiteEdicaoExpirado">
        <app-loading-spinner *ngIf="aGuardar" tamanho="sm" />
        <span *ngIf="!aGuardar">Guardar alterações</span>
      </button>
    </div>
  </div>
</div>

<ng-template #aCarregar>
  <div class="editar-post__carregando"><app-loading-spinner tamanho="lg" /></div>
</ng-template>
